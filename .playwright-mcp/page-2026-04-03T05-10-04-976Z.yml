        - text: Ми команда, яка працює над підвищенням якості національного туристичного продукту, розвитком подорожей Україною та просуванням України як туристичної дестинації в світі.
    - generic [ref=e61]:
      - generic [ref=e62]:
        - img "our description image" [ref=e64]
        - generic [ref=e65]:
          - heading "Місія" [level=2] [ref=e66]
          - generic [ref=e67]: Ми формуємо сучасну, сталу та діджиталізовану систему туризму в Україні, засновану на прозорості, достовірній статистиці, інноваційних сервісах і якісному туристичному продукті, який відповідає європейським стандартам. Ми працюємо над відновленням та стратегічною трансформацією галузі, аби підготувати її до відновлення іноземних туристичних потоків і повноцінного післявоєнного розвитку.
      - generic [ref=e68]:
