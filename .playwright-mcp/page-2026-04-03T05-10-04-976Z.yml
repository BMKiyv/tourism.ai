        - generic [ref=e71]:
          - heading "Візія" [level=2] [ref=e72]
          - generic [ref=e73]: Ми бачимо Україну інноваційною, інтегрованою в європейський простір туристичною дестинацією, яка динамічно розвивається і в якій туризм є доступним, зручним, відкритим і цікавим для масштабних інвестицій, рівним у можливостях для кожного мандрівника та однією зі складових зростання економіки.
